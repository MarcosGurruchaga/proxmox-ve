# VFIO configuration for NVIDIA GeForce GTX 1060 6GB (GP104)
# PCI IDs: 10de:1b83 (VGA Controller), 10de:10f0 (Audio Controller)
options vfio-pci ids=10de:1b83,10de:10f0 disable_vga=1

# Ensure vfio-pci loads before any proprietary or open source host drivers
softdep nouveau pre: vfio-pci
softdep nvidia pre: vfio-pci
softdep snd_hda_intel pre: vfio-pci
